    <rect x="194" y="0" width="98" height="28" rx="14" fill="#12233a" stroke="#264b73" stroke-width="1"/>
    <text x="243" y="18.5" text-anchor="middle">Local LLMs</text>

    <rect x="302" y="0" width="74" height="28" rx="14" fill="#12233a" stroke="#264b73" stroke-width="1"/>

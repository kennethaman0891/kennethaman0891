  <g transform="translate(175, 194)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#a8c7fa">
    <rect x="0" y="0" width="184" height="28" rx="14" fill="#12233a" stroke="#264b73" stroke-width="1"/>

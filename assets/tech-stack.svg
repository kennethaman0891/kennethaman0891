<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 315" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1726"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21304a"/>
      <stop offset="100%" stop-color="#1b283d"/>
    </linearGradient>
    <linearGradient id="rowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21304a" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#21304a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#21304a" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="876" height="311" rx="14" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5"/>

  <!-- Section Header -->
  <text x="32" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#3fb950">// stack</text>
  <text x="32" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">What I Work With</text>

  <!-- Row 1: Backend -->
  <text x="32" y="103" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6b809e">backend</text>
  <g transform="translate(175, 84)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#dbe4f0">
    <rect x="0" y="0" width="76" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>
    <text x="38" y="18.5" text-anchor="middle">Python</text>

    <rect x="86" y="0" width="76" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>
    <text x="124" y="18.5" text-anchor="middle">Django</text>

    <rect x="172" y="0" width="60" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>
    <text x="202" y="18.5" text-anchor="middle">PHP</text>

    <rect x="242" y="0" width="96" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>
    <text x="290" y="18.5" text-anchor="middle">REST APIs</text>

    <rect x="348" y="0" width="150" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>
    <text x="423" y="18.5" text-anchor="middle">Multi-Tenant Systems</text>
  </g>
  <rect x="32" y="125" width="816" height="1" fill="url(#rowLine)"/>

  <!-- Row 2: Frontend & Web -->
  <text x="32" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6b809e">frontend</text>
  <g transform="translate(175, 139)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#dbe4f0">
    <rect x="0" y="0" width="96" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>
    <text x="48" y="18.5" text-anchor="middle">TypeScript</text>

    <rect x="106" y="0" width="94" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>
    <text x="153" y="18.5" text-anchor="middle">JavaScript</text>

    <rect x="210" y="0" width="84" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>
    <text x="252" y="18.5" text-anchor="middle">React 19</text>

    <rect x="304" y="0" width="92" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>

    <rect x="386" y="0" width="80" height="28" rx="14" fill="#12233a" stroke="#264b73" stroke-width="1"/>
    <text x="426" y="18.5" text-anchor="middle">Whisper</text>

    <rect x="476" y="0" width="104" height="28" rx="14" fill="#12233a" stroke="#264b73" stroke-width="1"/>
    <text x="528" y="18.5" text-anchor="middle">Claude Code</text>

    <rect x="590" y="0" width="96" height="28" rx="14" fill="#12233a" stroke="#264b73" stroke-width="1"/>
    <text x="638" y="18.5" text-anchor="middle">Antigravity</text>
  </g>
  <rect x="32" y="235" width="816" height="1" fill="url(#rowLine)"/>

  <!-- Row 4: Native & Tooling -->
  <text x="32" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6b809e">native / tools</text>
  <g transform="translate(175, 249)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#dbe4f0">
    <rect x="0" y="0" width="82" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>
    <text x="41" y="18.5" text-anchor="middle">Tauri 2.0</text>

    <rect x="92" y="0" width="60" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>
    <text x="122" y="18.5" text-anchor="middle">Rust</text>

    <rect x="162" y="0" width="74" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>
    <text x="199" y="18.5" text-anchor="middle">Swift 6</text>

    <rect x="246" y="0" width="82" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>
    <text x="287" y="18.5" text-anchor="middle">xterm.js</text>

    <rect x="338" y="0" width="114" height="28" rx="14" fill="#161f31" stroke="#263654" stroke-width="1"/>

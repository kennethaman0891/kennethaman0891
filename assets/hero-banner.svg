<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f1624"/>
      <stop offset="100%" stop-color="#0d1a26"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3f66"/>
      <stop offset="50%" stop-color="#1e2d47"/>
      <stop offset="100%" stop-color="#24466b"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#a8c7fa"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21304a" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2a3f66" stop-opacity="1"/>
      <stop offset="80%" stop-color="#2a3f66" stop-opacity="1"/>
      <stop offset="100%" stop-color="#21304a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Main Card Container -->
  <rect x="2" y="2" width="876" height="306" rx="16" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="2" y="2" width="876" height="306" rx="16" fill="url(#glow1)"/>
  <rect x="2" y="2" width="876" height="306" rx="16" fill="url(#glow2)"/>

  <!-- Top Terminal Chrome Dots -->
  <circle cx="28" cy="24" r="4.5" fill="#ff5f56" opacity="0.8"/>
  <circle cx="44" cy="24" r="4.5" fill="#ffbd2e" opacity="0.8"/>
  <circle cx="60" cy="24" r="4.5" fill="#27c93f" opacity="0.8"/>

  <!-- Status Pill -->
  <rect x="295" y="26" width="290" height="26" rx="13" fill="#131c2e" stroke="#243554" stroke-width="1"/>
  <circle cx="315" cy="39" r="4.5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="328" y="43" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8b9bb4">
    <tspan fill="#c5d0e0" font-weight="600">ken@aman</tspan> · online — shipping daily
  </text>

  <!-- Hero Title -->
  <text x="440" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8" fill="url(#titleGrad)">
    Kenneth Aman
  </text>

  <!-- Subtitle Roles -->
  <text x="440" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" letter-spacing="0.4" fill="#58a6ff">
    AI Automation Engineer   ·   Full-Stack Developer   ·   Systems Builder
  </text>

  <!-- Description Lines -->
  <text x="440" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#9aa7bd">
    I build <tspan fill="#ffffff" font-weight="600">Task Orchestrator (tto)</tspan> &amp; <tspan fill="#ffffff" font-weight="600">Developer Workflow Orchestrator (DWO)</tspan> — native desktop
  </text>
  <text x="440" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#9aa7bd">
    command centers where dev tasks run across parallel AI coding agents — plus <tspan fill="#a8c7fa" font-weight="600">100% local-first AI tooling</tspan>.
  </text>

  <!-- Divider -->
  <rect x="80" y="226" width="720" height="1" fill="url(#dividerGrad)"/>

  <!-- Workflow Pipeline Pills -->
  <g transform="translate(115, 246)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="128" height="32" rx="8" fill="#141e30" stroke="#263859" stroke-width="1"/>
    <text x="64" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8c7fa" font-weight="600">01. spec first</text>

    <text x="144" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#58a6ff">→</text>

    <!-- Step 2 -->
    <rect x="160" y="0" width="156" height="32" rx="8" fill="#141e30" stroke="#263859" stroke-width="1"/>
    <text x="238" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8c7fa" font-weight="600">02. AI implements</text>

    <text x="332" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#58a6ff">→</text>

    <!-- Step 3 -->
    <rect x="348" y="0" width="146" height="32" rx="8" fill="#141e30" stroke="#263859" stroke-width="1"/>
    <text x="421" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8c7fa" font-weight="600">03. review diffs</text>

    <text x="510" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#58a6ff">→</text>

    <!-- Step 4 -->
    <rect x="526" y="0" width="128" height="32" rx="8" fill="#122824" stroke="#235c4b" stroke-width="1"/>
    <text x="590" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#3fb950" font-weight="600">04. ship daily</text>
  </g>
</svg>
